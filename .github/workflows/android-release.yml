name: Android Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.1.271). Defaults to the current branch/ref name."
        required: false
        type: string

jobs:
  release:
    name: Build & publish release
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
