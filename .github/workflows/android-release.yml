name: Android Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.1.271). Defaults to the current branch/ref name."
        required: false
        type: string

# Reusable workflows CANNOT elevate permissions beyond the caller's ceiling.
# The reusable release-build.yml publish job needs contents: write, and this
# repo's default_workflow_permissions is read, so without granting write here
# the workflow is rejected at load with startup_failure.
permissions:
  contents: write

jobs:
  # Resolve the release tag in a step output; passing it via a job output
  # mirrors the proven daily-release.yml pattern.
  prep:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  release:
    name: Build & publish release
    needs: prep
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.prep.outputs.tag }}
    secrets: inherit
