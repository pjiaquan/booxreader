name: Daily Release

# Builds and publishes a new release every day at 02:00 UTC (10:00 Taipei):
#   1. Bumps versionCode/versionName via the `incrementVersionCode` Gradle task
#   2. Commits the bump to `main` and tags it as v<versionName>
#   3. Calls the shared release pipeline (release-build.yml) to build, sign,
#      attach APK/AAB to the GitHub Release, and notify Telegram
#
# If there are no new commits since the last tag, the run is skipped (unless
# `force` is set via manual dispatch).
#
# Note: commits/tags pushed with GITHUB_TOKEN do NOT re-trigger other workflows,
# so this does not create an infinite loop and does not double-fire the
# tag-push-triggered android-release.yml.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC every day
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if there are no new commits since the last tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: true

jobs:
  bump-version:
    name: Bump version & tag
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.bump.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Skip if no changes since last release
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          LATEST_TAG=$(git tag --sort=-version:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags; proceeding with first automated release."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMMITS=$(git rev-list --count "${LATEST_TAG}..HEAD" 2>/dev/null || echo 1)
          echo "Latest tag: ${LATEST_TAG}, commits since: ${COMMITS}"
          if [ "$COMMITS" -eq 0 ] && [ "$FORCE" != "true" ]; then
            echo "No new commits since ${LATEST_TAG}; skipping daily release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.skip == 'false'
        run: chmod +x gradlew

      - name: Increment version
        if: steps.check.outputs.skip == 'false'
        run: ./gradlew incrementVersionCode

      - name: Read new version name
        id: bump
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "New version: ${VERSION_NAME}"

      - name: Commit version bump
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version_name }} (daily release)"
          # Rebase + push with retries to survive transient network failures /
          # concurrent pushes to main (mirrors the build retry pattern).
          for i in {1..3}; do
            git pull --rebase origin main && git push origin main && break
            if [ $i -lt 3 ]; then
              echo "Push attempt $i failed, retrying in 10 seconds..."
              sleep 10
            else
              echo "Push failed after 3 attempts"
              exit 1
            fi
          done

      - name: Create and push tag
        if: steps.check.outputs.skip == 'false'
        run: |
          TAG="v${{ steps.bump.outputs.version_name }}"
          git tag "${TAG}"
          git push origin "${TAG}"

  release:
    name: Build & publish release
    needs: bump-version
    if: needs.bump-version.outputs.version_name != ''
    uses: ./.github/workflows/release-build.yml
    with:
      tag: v${{ needs.bump-version.outputs.version_name }}
    secrets: inherit
