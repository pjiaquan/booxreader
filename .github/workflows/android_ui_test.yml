name: Android Automated UI Test & Crash Catch

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ui-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 1. Build Debug APK & AndroidTest APK
      - name: Build Debug & Test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      # 2. Run UI Tests on Android Emulator with UI Automator
      - name: Run UI Test on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            # Clear old Logcat logs
            adb logcat -c

            # Install Debug APK and AndroidTest APK
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk || true

            # Launch Welcome Activity
            adb shell am start -n my.hinoki.booxreader/my.hinoki.booxreader.ui.welcome.WelcomeActivity || true
            sleep 2

            # Run UI Automator Android Instrumented Tests via adb am instrument
            adb shell am instrument -w -r my.hinoki.booxreader.test/androidx.test.runner.AndroidJUnitRunner || true

            # Capture only BooxReader-specific FATAL EXCEPTION or AndroidRuntime crashes.
            # Filtering by package name prevents false positives from unrelated system-level
            # errors (DocumentsUI, ConnectivityService, etc.) that appear on every emulator boot.
            adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime" | grep "my\.hinoki\.booxreader" > crash_log.txt || true

            # Check for crash records
            if [ -s crash_log.txt ]; then
              echo "❌ App Crash / Fatal Exception Detected!"
              cat crash_log.txt
              exit 1
            else
              echo "✅ No BooxReader app crashes detected during UI Automator test."
            fi

      # 3. Upload Crash Logs
      - name: Upload Crash Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-crash-log
          path: crash_log.txt
